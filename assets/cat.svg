<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cute fluffy cat peeking up">
  <defs>
    <radialGradient id="cheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb6c1" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffb6c1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft body/neck fluff so it blends into the box -->
  <ellipse cx="150" cy="300" rx="120" ry="90" fill="#ffffff"/>
  <ellipse cx="150" cy="300" rx="120" ry="90" fill="#f2d9c2" opacity="0.4"/>

  <!-- ears (tan outer, pale inner) -->
  <path d="M64,132 L34,26 L132,86 Z" fill="#e3ab78"/>
  <path d="M236,132 L266,26 L168,86 Z" fill="#e3ab78"/>
  <path d="M74,124 L54,54 L126,90 Z" fill="#fbe3cc"/>
  <path d="M226,124 L246,54 L174,90 Z" fill="#fbe3cc"/>

  <!-- head -->
  <ellipse cx="150" cy="182" rx="118" ry="108" fill="#ffffff"/>

  <!-- tan patches: top blaze -->
  <path d="M104,86 Q150,58 196,86 Q182,124 150,124 Q118,124 104,86 Z" fill="#e3ab78"/>
  <!-- tan patches: cheeks -->
  <path d="M32,168 Q10,206 42,248 Q70,214 66,168 Q48,150 32,168 Z" fill="#e3ab78"/>
  <path d="M268,168 Q290,206 258,248 Q230,214 234,168 Q252,150 268,168 Z" fill="#e3ab78"/>

  <!-- blush -->
  <circle cx="86" cy="212" r="26" fill="url(#cheekBlush)"/>
  <circle cx="214" cy="212" r="26" fill="url(#cheekBlush)"/>

  <!-- eyes -->
  <ellipse cx="110" cy="188" rx="27" ry="32" fill="#2c2420"/>
  <ellipse cx="190" cy="188" rx="27" ry="32" fill="#2c2420"/>
  <circle cx="100" cy="174" r="8" fill="#ffffff"/>
  <circle cx="180" cy="174" r="8" fill="#ffffff"/>
  <circle cx="118" cy="196" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="198" cy="196" r="4" fill="#ffffff" opacity="0.7"/>

  <!-- nose -->
  <path d="M150,222 L136,238 Q150,252 164,238 Z" fill="#f6a8bb"/>

  <!-- mouth -->
  <path d="M150,240 Q150,254 130,260" stroke="#a9836b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M150,240 Q150,254 170,260" stroke="#a9836b" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <line x1="10" y1="198" x2="82" y2="192" stroke="#d8cfc7" stroke-width="3" stroke-linecap="round"/>
  <line x1="8" y1="220" x2="82" y2="220" stroke="#d8cfc7" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="242" x2="86" y2="234" stroke="#d8cfc7" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="198" x2="218" y2="192" stroke="#d8cfc7" stroke-width="3" stroke-linecap="round"/>
  <line x1="292" y1="220" x2="218" y2="220" stroke="#d8cfc7" stroke-width="3" stroke-linecap="round"/>
  <line x1="286" y1="242" x2="214" y2="234" stroke="#d8cfc7" stroke-width="3" stroke-linecap="round"/>
</svg>
